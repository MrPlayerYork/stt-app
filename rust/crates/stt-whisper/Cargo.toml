[package]
name = "stt-whisper"
description = "Whisper transcription via whisper-rs (whisper.cpp + Vulkan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the `stt` binary may depend on this crate (AGENTS.md).
#
# `whisper` is OFF by default so `cargo check --workspace` never compiles whisper.cpp while this crate is
# a stub. The `stt` binary enables it (Phase 3); stt-whisper stays a plain dependency of it.
# Building with it ON needs the `heavy` board slot.
[features]
default = []
whisper = ["dep:whisper-rs"]

[dependencies]
stt-core.workspace = true
stt-download.workspace = true
thiserror.workspace = true
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
stt-core = { workspace = true, features = ["fakes"] }
# WAV loading for the GPU tests and the bench example.
hound = "3"

[lints]
workspace = true

[[example]]
name = "bench"
required-features = ["whisper"]
