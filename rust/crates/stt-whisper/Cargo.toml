[package]
name = "stt-whisper"
description = "Whisper transcription via whisper-rs (whisper.cpp + Vulkan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the `stt` binary may depend on this crate (AGENTS.md).
#
# `whisper` is OFF by default so `cargo check --workspace` never compiles whisper.cpp while this crate is
# a stub. P2-8 wires it up (and decides whether the binary enables it or it becomes a plain dependency).
# Building with it ON needs the `heavy` board slot.
[features]
default = []
whisper = ["dep:whisper-rs"]

[dependencies]
stt-core.workspace = true
stt-download.workspace = true
thiserror.workspace = true
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
stt-core = { workspace = true, features = ["fakes"] }

[lints]
workspace = true
