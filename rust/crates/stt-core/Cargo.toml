[package]
name = "stt-core"
description = "Shared config schema, secrets API, types, traits and error types for the STT app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Simple in-memory fakes of every trait, for other crates' tests:
#   [dev-dependencies] stt-core = { workspace = true, features = ["fakes"] }
fakes = []

[dependencies]
serde.workspace = true
toml.workspace = true
indexmap.workspace = true
thiserror.workspace = true
dirs.workspace = true
keyring.workspace = true

[dev-dependencies]
# Integration tests in tests/ use the fakes.
stt-core = { path = ".", features = ["fakes"] }
toml.workspace = true

[lints]
workspace = true
